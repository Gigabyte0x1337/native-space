# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "native-space-language"
version = "2.0.0"
description = "Exact homogeneous Native Space language and runtime"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "native-space"
path = "src/main.rs"

[dependencies]
num-bigint = { version = "0.4.6", features = ["serde"] }
num-rational = { version = "0.4.2", features = ["serde"] }
num-traits = "0.2.19"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
rmcp = { version = "3.1.4", features = ["transport-io"] }
schemars = "1.0.4"
tokio = { version = "1.49.0", features = ["rt", "io-std", "macros", "time"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
