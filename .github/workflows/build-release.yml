name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.88.0

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: linux-x64
            binary: native-space
          - runner: ubuntu-24.04-arm
            asset: linux-arm64
            binary: native-space
          - runner: windows-latest
            asset: windows-x64
            binary: native-space.exe
          - runner: windows-11-arm
            asset: windows-arm64
            binary: native-space.exe
          - runner: macos-15-intel
            asset: macos-x64
            binary: native-space
          - runner: macos-latest
            asset: macos-arm64
            binary: native-space

    steps:
      - name: Check out the source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install the required Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
          rustup default "$RUST_VERSION"

      - name: Verify formatting
        run: cargo fmt --manifest-path language/runtime/Cargo.toml --check

      - name: Run the complete test suite
        run: cargo test --manifest-path language/runtime/Cargo.toml --locked

      - name: Run strict lint checks
        run: cargo clippy --manifest-path language/runtime/Cargo.toml --locked --all-targets --all-features -- -D warnings

      - name: Build the release binary
        run: cargo build --manifest-path language/runtime/Cargo.toml --locked --release --bin native-space

      - name: Create the release archive
        shell: bash
        run: |
          set -euo pipefail
          package="native-space-${{ matrix.asset }}"
          mkdir -p "dist/$package"
          cp "language/runtime/target/release/${{ matrix.binary }}" "dist/$package/"
          cp README.md LICENSE.md "dist/$package/"
          tar -czf "dist/$package.tar.gz" -C dist "$package"

      - name: Upload the platform archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/native-space-${{ matrix.asset }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download all platform archives
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true

      - name: Publish the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
